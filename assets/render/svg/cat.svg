    <!-- forehead stripes -->
    <path d="M 512 220 L 512 268" fill="none" stroke="#E07E22" stroke-width="18"/>
    <path d="M 458 230 L 450 274" fill="none" stroke="#E07E22" stroke-width="18"/>
    <path d="M 566 230 L 574 274" fill="none" stroke="#E07E22" stroke-width="18"/>

    <!-- muzzle -->
    <ellipse cx="512" cy="522" rx="118" ry="82" fill="#FFEFD6" stroke-width="12"/>

    <!-- eyes -->
    <circle cx="413" cy="413" r="44" fill="#35251C" stroke="none"/>
    <circle cx="611" cy="413" r="44" fill="#35251C" stroke="none"/>
    <circle cx="399" cy="399" r="14" fill="#FFFFFF" stroke="none"/>
    <circle cx="597" cy="399" r="14" fill="#FFFFFF" stroke="none"/>
    <circle cx="427" cy="428" r="7" fill="#FFFFFF" stroke="none"/>
    <circle cx="625" cy="428" r="7" fill="#FFFFFF" stroke="none"/>

    <!-- blush -->
    <ellipse cx="368" cy="498" rx="32" ry="19" fill="#F9B8C4" stroke="none"/>
    <ellipse cx="656" cy="498" rx="32" ry="19" fill="#F9B8C4" stroke="none"/>

    <!-- nose -->
    <path d="M 484 496 Q 512 484 540 496 Q 542 506 512 528 Q 482 506 484 496 Z" fill="#F58EA0" stroke-width="10"/>

    <!-- mouth -->
    <path d="M 512 528 Q 510 552 478 550" fill="none" stroke-width="9"/>
    <path d="M 512 528 Q 514 552 546 550" fill="none" stroke-width="9"/>

    <!-- whiskers -->
    <path d="M 285 455 L 190 430" fill="none" stroke-width="8"/>
    <path d="M 272 500 L 172 500" fill="none" stroke-width="8"/>
    <path d="M 285 545 L 190 570" fill="none" stroke-width="8"/>
    <path d="M 739 455 L 834 430" fill="none" stroke-width="8"/>
    <path d="M 752 500 L 852 500" fill="none" stroke-width="8"/>
    <path d="M 739 545 L 834 570" fill="none" stroke-width="8"/>
  </g>
