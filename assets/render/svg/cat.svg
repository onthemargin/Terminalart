    <path d="M 640 820 Q 830 850 858 715 Q 870 640 806 622" fill="none" stroke="#F6A23B" stroke-width="38"/>

    <!-- body -->
    <ellipse cx="512" cy="745" rx="200" ry="170" fill="#F6A23B" stroke-width="14"/>
