    <ellipse cx="512" cy="800" rx="112" ry="96" fill="#FFEFD6" stroke-width="12"/>

    <!-- front paws -->
    <ellipse cx="432" cy="878" rx="64" ry="46" fill="#F6A23B" stroke-width="12"/>
    <ellipse cx="592" cy="878" rx="64" ry="46" fill="#F6A23B" stroke-width="12"/>
    <path d="M 414 862 L 414 890" fill="none" stroke-width="8"/>
    <path d="M 450 862 L 450 890" fill="none" stroke-width="8"/>
    <path d="M 574 862 L 574 890" fill="none" stroke-width="8"/>
    <path d="M 610 862 L 610 890" fill="none" stroke-width="8"/>

    <!-- ears -->
    <path d="M 300 310 L 265 105 L 480 195 Z" fill="#F6A23B" stroke-width="14"/>
    <path d="M 724 310 L 759 105 L 544 195 Z" fill="#F6A23B" stroke-width="14"/>
    <path d="M 322 268 L 296 148 L 428 206 Z" fill="#F7A8B8" stroke-width="10"/>
    <path d="M 702 268 L 728 148 L 596 206 Z" fill="#F7A8B8" stroke-width="10"/>

    <!-- head -->
