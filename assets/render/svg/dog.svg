<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>

  <g stroke="#3A2313" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M 690 810
             C 795 802, 852 728, 838 652
             C 831 614, 786 612, 777 654
             C 766 706, 742 748, 678 762
             Z" fill="#F2A65A"/>

    <!-- body -->
    <path d="M 402 560
             C 328 615, 298 718, 304 800
             C 309 872, 362 902, 512 902
             C 662 902, 715 872, 720 800
             C 726 718, 696 615, 622 560
             Z" fill="#F2A65A"/>

    <!-- belly -->
    <ellipse cx="512" cy="762" rx="104" ry="118" fill="#FFE9C7" stroke="none"/>

    <!-- front legs -->
    <rect x="416" y="672" width="62" height="190" rx="31" fill="#F2A65A"/>
    <rect x="546" y="672" width="62" height="190" rx="31" fill="#F2A65A"/>
    <!-- paws -->
    <ellipse cx="447" cy="866" rx="58" ry="38" fill="#F2A65A"/>
    <ellipse cx="577" cy="866" rx="58" ry="38" fill="#F2A65A"/>
    <path d="M 431 846 L 431 878" fill="none" stroke-width="9"/>
    <path d="M 463 846 L 463 878" fill="none" stroke-width="9"/>
    <path d="M 561 846 L 561 878" fill="none" stroke-width="9"/>
    <path d="M 593 846 L 593 878" fill="none" stroke-width="9"/>

    <!-- head -->
    <ellipse cx="512" cy="390" rx="245" ry="228" fill="#F2A65A"/>

    <!-- hair tuft -->
    <path d="M 478 172
             C 480 138, 500 126, 510 152
             C 518 126, 542 132, 544 168" fill="#F2A65A" stroke-width="12"/>

    <!-- ears -->
    <path d="M 345 205
             C 262 225, 232 330, 243 432
             C 249 494, 276 528, 317 522
             C 358 516, 377 458, 377 398
             C 377 328, 383 246, 345 205
             Z" fill="#B36A32"/>
    <path d="M 679 205
             C 762 225, 792 330, 781 432
             C 775 494, 748 528, 707 522
             C 666 516, 647 458, 647 398
             C 647 328, 641 246, 679 205
             Z" fill="#B36A32"/>

    <!-- muzzle -->
    <ellipse cx="512" cy="488" rx="130" ry="92" fill="#FFE9C7"/>

    <!-- blush -->
    <ellipse cx="352" cy="468" rx="38" ry="24" fill="#FFAFAF" stroke="none" opacity="0.8"/>
    <ellipse cx="672" cy="468" rx="38" ry="24" fill="#FFAFAF" stroke="none" opacity="0.8"/>

    <!-- eyebrows -->
    <path d="M 386 302 Q 420 286 452 300" fill="none" stroke-width="11"/>
    <path d="M 572 300 Q 604 286 638 302" fill="none" stroke-width="11"/>

    <!-- eyes -->
    <circle cx="420" cy="368" r="38" fill="#33221A" stroke="none"/>
    <circle cx="604" cy="368" r="38" fill="#33221A" stroke="none"/>
    <circle cx="433" cy="355" r="13" fill="#FFFFFF" stroke="none"/>
    <circle cx="617" cy="355" r="13" fill="#FFFFFF" stroke="none"/>
    <circle cx="409" cy="381" r="6" fill="#FFFFFF" stroke="none"/>
    <circle cx="593" cy="381" r="6" fill="#FFFFFF" stroke="none"/>

    <!-- nose -->
    <path d="M 470 446
             Q 512 428 554 446
             Q 554 484 512 498
             Q 470 484 470 446 Z" fill="#3A2313" stroke-width="10"/>
    <ellipse cx="494" cy="448" rx="10" ry="6" fill="#FFFFFF" stroke="none" opacity="0.65"/>

    <!-- mouth -->
    <path d="M 512 498 L 512 520" fill="none" stroke-width="11"/>
    <path d="M 512 520 Q 481 545 450 522" fill="none" stroke-width="11"/>
    <path d="M 512 520 Q 543 545 574 522" fill="none" stroke-width="11"/>

    <!-- tongue -->
    <path d="M 484 530
             Q 512 540 540 530
             L 536 560
             Q 512 588 488 560
             Z" fill="#FF8FA3" stroke-width="10"/>
    <path d="M 512 545 L 512 566" fill="none" stroke="#E9647F" stroke-width="6"/>
  </g>
</svg>
